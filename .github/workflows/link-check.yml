# Checks every link in the site's HTML pages with lychee. The job fails when a link is broken.
# Settings (retries, timeout, hosts that are skipped on purpose) live in .github/lychee.toml.
name: Link check

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.md"
      - "**.json"
      - ".github/lychee.toml"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir makes root-relative links (/assets/..., /anyps/) resolve against the repo root.
          # --remap checks the site's own absolute links (canonical, og:image) against the files in this
          # commit, so a push is not failed by the few minutes GitHub Pages takes to publish it.
          args: >-
            --config .github/lychee.toml
            --root-dir "${{ github.workspace }}"
            --remap "https://damananders.github.io/ file://${{ github.workspace }}/"
            --no-progress
            "./**/*.html"
          fail: true
          failIfEmpty: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
